[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# The page may only load its own files and may not send data anywhere:
# connect-src 'self' is what backs the "your statements never leave the browser" promise.
# blob: workers are used by the Excel reader; inline styles by the animations.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
